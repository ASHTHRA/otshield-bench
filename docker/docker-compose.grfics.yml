# Minimal GRFICSv3/OpenPLC integration for OTShield Bench v0.3
#
# This compose file runs only the OpenPLC container from the GRFICSv3 stack
# on a local bridge network.  The full GRFICSv3 lab (simulation, SCADA HMI,
# attacker, router, etc.) is NOT started because it requires macvlan
# networking with a dedicated host NIC and substantial resources (~8 GB RAM).
#
# This minimal setup is sufficient to:
#   1. Run a real OpenPLC Modbus TCP server (port 502)
#   2. Capture real Modbus TCP packets with tcpdump
#   3. Convert captured packets to OTB-INGEST-SOURCE/0.1 JSON
#   4. Ingest the JSON through the existing OTB-INGEST pipeline
#
# Usage:
#   docker compose -f docker-compose.grfics.yml up -d
#   # wait for health check to pass, then capture traffic
#   docker compose -f docker-compose.grfics.yml down -v
#
# Safety: This is passive observation only.  No attacks are launched.
# Any future active experiment must be separately specified and confined
# to an explicitly authorized, isolated research laboratory.

services:
  openplc:
    image: fortiphyd/grfics-plc:latest
    container_name: otshield-openplc
    hostname: openplc
    cap_add:
      - NET_ADMIN
    ports:
      - "${OTSHIELD_OPENPLC_HTTP_PORT:-8080}:8080"
      - "${OTSHIELD_OPENPLC_MODBUS_PORT:-502}:502"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    dns:
      - 8.8.8.8
    networks:
      otshield-ics-net:
        ipv4_address: 192.168.100.2
    restart: unless-stopped

  capture:
    image: alpine:3.19
    container_name: otshield-capture
    hostname: capture
    depends_on:
      openplc:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./captures:/captures
    networks:
      otshield-ics-net:
    command: >
      sh -c "apk add --no-cache tcpdump tshark python3 py3-pip &&
             echo 'Capture container ready. Run capture from host.' &&
             sleep infinity"
    restart: unless-stopped

networks:
  otshield-ics-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
