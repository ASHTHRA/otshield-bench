[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "otshield-bench"
version = "0.1.0a0"
description = "Reproducible offline OT detection benchmarks with synthetic Modbus telemetry"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
otshield = "otshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otshield = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
