[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otshield-bench"
version = "0.5.1a0"
description = "Reproducible offline OT detection benchmarks for synthetic and lab-derived Modbus telemetry"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "pymodbus>=3.0,<4", "pyyaml>=6,<7"]

[project.scripts]
otshield = "otshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otshield = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
